<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AvatarLM Mockup</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
      .wrap { max-width: 900px; margin: 24px auto; display: grid; gap: 12px; padding: 0 16px; }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
      .chips span { display: inline-block; margin-right: 8px; margin-bottom: 8px; border-radius: 999px; padding: 6px 10px; background: #e2e8f0; }
      .chips span.active { background: #0f172a; color: #fff; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>AvatarLM Control Deck</h1>
        <p>AI performing knowledge with emotion, presence, and environment.</p>
      </section>
      <section class="card chips">
        <h2>Learning Modes</h2>
        <span class="active">video_explainer</span><span>podcast</span><span>infographic</span><span>quiz</span>
      </section>
      <section class="card">
        <h2>Emotion Preset</h2>
        <p>heartbroken (active)</p>
      </section>
      <section class="card">
        <h2>Avatar Stage</h2>
        <p>Scene: cliff</p>
        <p>Mode: video_explainer</p>
      </section>
    </main>
  </body>
</html>
